<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Builder | Grammar Game</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#269bd5;
  --dark:#205b91;
  --green:#219653;
  --red:#d9444e;
}

body{
  margin:0;
  background:linear-gradient(135deg,#dff5ff,#f5fbff);
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:#29475c;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

header,.card{
  background:white;
  border:2px solid #d5edfb;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 5px 18px #6aaed018;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.plant{
  font-size:48px;
}

h1{
  font-size:clamp(26px,4vw,36px);
  margin:0;
  color:var(--dark);
}

.subtitle{
  margin:5px 0 0;
  color:#7191a5;
  font-size:16px;
}

.top-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.timer{
  font-size:24px;
  font-weight:bold;
  background:#e8f7ff;
  padding:13px 15px;
  border-radius:15px;
  color:var(--dark);
}

.mode{
  padding:13px 16px;
  border:2px solid #cce7f7;
  border-radius:14px;
  background:white;
  color:var(--dark);
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.mode.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

h2{
  color:#3685b3;
  margin:0 0 12px;
  font-size:25px;
}

.instructions{
  color:#6a899f;
  line-height:1.6;
  font-size:17px;
  margin:0;
}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:17px;
}

.pill{
  background:#e8f6ff;
  color:#287ba8;
  padding:8px 13px;
  border-radius:20px;
  font-size:15px;
  font-weight:bold;
}

.answer-area{
  background:#f0faff;
  border:2px solid #d4efff;
  border-radius:18px;
  padding:18px;
  margin-top:20px;
}

.area-title{
  font-weight:bold;
  color:#258bc4;
  margin-bottom:14px;
  font-size:20px;
}

.answer-slots{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  min-height:78px;
  align-items:center;
}

.slot{
  min-height:67px;
  min-width:85px;
  padding:10px 13px;
  border:2px dashed #b9d6ee;
  border-radius:14px;
  background:white;
  color:#a1b9cd;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:0 1 auto;
  font-size:24px;
}

.slot.filled{
  border-style:solid;
  border-color:#83c9f0;
  color:var(--dark);
  font-weight:bold;
}

.slot.filled:not(.correct):not(.wrong){
  cursor:pointer;
}

.slot.filled:not(.correct):not(.wrong):hover{
  background:#fff0f0;
  border-color:#e99a9a;
}

.slot.correct{
  border-color:#75cda0;
  background:#effcf4;
  color:#176c3d;
}

.slot.wrong{
  border-color:#efaaaa;
  background:#fff1f1;
  color:#a52e37;
}

.mark{
  color:var(--green);
  font-size:24px;
  font-weight:bold;
}

.word-bank{
  background:#fff9e9;
  border:2px solid #ffe8a6;
  border-radius:18px;
  padding:18px;
  margin-top:17px;
}

.bank-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.bank-head h2{
  margin:0;
  font-size:22px;
}

.tiles{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

.tile{
  background:white;
  border:2px solid #8ed5fa;
  border-radius:15px;
  padding:17px 22px;
  font-size:25px;
  font-weight:bold;
  color:#205b91;
  cursor:pointer;
  box-shadow:0 4px 0 #d2eaf6;
  transition:transform .12s;
  font-family:inherit;
}

.tile:hover{
  transform:translateY(-2px);
  background:#f2fbff;
}

.tile:disabled{
  opacity:.4;
  cursor:default;
  transform:none;
}

.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin:23px 0 3px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:15px 23px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  font-family:inherit;
}

.primary{
  background:var(--blue);
  color:white;
  box-shadow:0 4px 0 #b8e4fa;
}

.primary:hover{
  background:#1687c0;
}

.secondary{
  background:white;
  border:2px solid #cce7f7;
  color:var(--dark);
}

.delete{
  background:#fff0f0;
  border:2px solid #f3caca;
  color:#bd3540;
}

.speak{
  background:#eef9ff;
  border:2px solid #a8dff8;
  color:#1678aa;
}

.speak:hover{
  background:#dff4ff;
}

.btn:disabled{
  opacity:.4;
  cursor:default;
}

.feedback{
  text-align:center;
  font-weight:bold;
  font-size:19px;
  min-height:30px;
  margin:15px 0;
  color:#3685b3;
  line-height:1.5;
}

.feedback.good{
  color:#16854a;
}

.feedback.bad{
  color:#c43f48;
}

.score-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f1f9ff;
  border-radius:13px;
  text-align:center;
  padding:14px 5px;
}

.num{
  font-size:30px;
  font-weight:bold;
  color:#358dc0;
}

.small{
  font-size:14px;
  color:#7893a5;
  margin-top:4px;
}

.rules{
  color:#648399;
  line-height:1.9;
  font-size:16px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#17415dbb;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:5;
}

.overlay.show{
  display:flex;
}

.modal{
  background:white;
  padding:30px;
  border-radius:22px;
  max-width:450px;
  width:100%;
  text-align:center;
}

.modal h2{
  font-size:30px;
}

.modal p{
  line-height:1.7;
  color:#66859a;
  font-size:18px;
}

@media(max-width:600px){

  .app{
    padding:9px;
  }

  header,.card{
    padding:15px;
    border-radius:17px;
  }

  .top-right{
    width:100%;
    gap:6px;
  }

  .timer{
    font-size:20px;
    padding:12px;
  }

  .mode{
    flex:1;
    padding:11px 4px;
    font-size:14px;
  }

  .slot{
    min-width:calc(50% - 6px);
    min-height:60px;
    font-size:22px;
    padding:8px 5px;
  }

  .tile{
    font-size:23px;
    padding:15px 17px;
  }

  .btn{
    font-size:16px;
    padding:13px 15px;
  }

  .num{
    font-size:25px;
  }

  .small{
    font-size:12px;
  }
}
</style>
</head>
